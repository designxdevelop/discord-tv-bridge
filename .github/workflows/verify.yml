name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned WebRTC framework
        run: Scripts/fetch-webrtc.sh
      - name: Verify generated Xcode project
        run: |
          python3 Scripts/generate-project.py
          git diff --exit-code -- DiscordTVBridge.xcodeproj Config
      - name: Test signaling and discovery
        run: swift test --skip loopbackStreamsVideoAndAudioWithMeasuredLatency
      - name: Build Mac sender
        run: >-
          xcodebuild -project DiscordTVBridge.xcodeproj -scheme MacSender
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build Apple TV receiver
        run: >-
          xcodebuild -project DiscordTVBridge.xcodeproj -scheme TVReceiver
          -configuration Release -destination 'generic/platform=tvOS'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
